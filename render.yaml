services:
  - type: web
    name: princesahmad
    runtime: python
    buildCommand: pip install -r requirements-production.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn princesahmad.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: princesahmad.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://princesahmad.onrender.com
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "300"
      - key: GUNICORN_FORWARDED_ALLOW_IPS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: princesahmad-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: princesahmad-db
    plan: basic-256mb