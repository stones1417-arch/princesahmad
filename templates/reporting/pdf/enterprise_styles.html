<style>
/* Final print layer: compact, deterministic and suitable for Chromium PDF. */
:root{--p-green:#0b6b50;--p-green-deep:#064b39;--p-gold:#d1a735;--p-ink:#13201c;--p-muted:#69756f;--p-line:#dfe6e2;--p-soft:#f5f8f6}
html,body{background:#fff;color:var(--p-ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:210mm;min-height:297mm;grid-template-columns:58mm minmax(0,1fr);overflow:hidden;background:#fff;page-break-after:auto}
.content{min-width:0;padding:10mm 8mm 7mm}
.sidebar{padding:8mm 5mm 6mm;border-left:1.6mm solid var(--p-gold);background:linear-gradient(180deg,#fffcf3,#fff 48%,#fffcf4)}
.logo-panel{height:34mm;margin:0 0 5mm;display:flex;align-items:center;justify-content:center}.logo-panel img{max-width:34mm;max-height:29mm}
.sidebar-card{margin-bottom:4mm;border-color:#e7e8e5;border-radius:4mm;box-shadow:0 2mm 5mm rgba(27,49,40,.055)}
.card-title{padding:3mm;background:linear-gradient(110deg,var(--p-green-deep),#148064);font-size:11pt}
.card-body{padding:4mm}.label,.signature-label{font-size:7.5pt}.value{margin-top:1.2mm;font-size:9pt;overflow-wrap:anywhere}.divider{margin:2.6mm 0}.signature-line{height:6mm;padding-top:1.5mm;border-color:#9ba49f;font-size:7.5pt}.signature-box{height:18mm}
.approval-person{margin-bottom:3mm;padding:2.5mm;display:flex;align-items:center;gap:2mm;border:1px solid #cbe7da;border-radius:3mm;background:#f0faf5}.approval-mark{width:7mm;height:7mm;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--p-green);font-weight:900}.approval-person span,.approval-person strong{display:block}.approval-person span{color:var(--p-muted);font-size:6.5pt}.approval-person strong{margin-top:.5mm;font-size:7.5pt}
.electronic-signature{padding:3mm 2mm;text-align:center;border:1px solid #c7e4d7;border-radius:3mm;background:linear-gradient(145deg,#f5fcf8,#e9f7f0)}.electronic-signature.pending{border-color:#ead9ad;background:linear-gradient(145deg,#fffdf6,#fff7df)}.signature-seal{position:relative;width:17mm;height:17mm;margin:0 auto 2mm;display:grid;place-items:center;border:1.2mm double var(--p-green);border-radius:50%;color:var(--p-green);background:#fff;font-size:13pt;font-weight:900}.signature-seal i{position:absolute;right:-1mm;bottom:-1mm;width:6mm;height:6mm;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--p-green);font-size:7pt;font-style:normal}.pending .signature-seal{border-color:#b78618;color:#9a6c0b}.signature-state,.signature-caption{display:block}.signature-state{color:var(--p-green);font-size:8pt}.pending .signature-state{color:#8b6511}.signature-caption{margin-top:1mm;color:var(--p-muted);font-size:5.7pt;line-height:1.6}.signature-data{margin-top:2.5mm}.signature-data>div{padding:1.5mm 0;border-bottom:1px solid var(--p-line)}.signature-data span,.signature-data strong{display:block}.signature-data span{color:var(--p-muted);font-size:5.7pt}.signature-data strong{margin-top:.7mm;color:var(--p-ink);font-size:6.8pt;line-height:1.5}.verification-block{margin-top:2.5mm;padding:2mm;border:1px dashed #91b7a7;border-radius:2.5mm;text-align:center;background:#fbfefc}.verification-block span,.verification-block strong{display:block}.verification-block span{color:var(--p-muted);font-size:5.5pt}.verification-block strong{margin-top:1mm;color:var(--p-green-deep);font-size:6.2pt;letter-spacing:.25px}.verification-block.muted{border-color:#d7c28b;background:#fffaf0}.verification-block.muted strong{color:#8b6511}
.report-header{position:relative;margin-bottom:4mm;padding:2mm 0 4mm}.report-classification{margin-bottom:3mm;display:flex;justify-content:space-between;align-items:center;color:var(--p-muted);font-size:7pt}.report-classification span{padding:1.4mm 3mm;border:1px solid #e3d4a4;border-radius:999px;color:#8a6814;background:#fffaf0;font-weight:900}.report-classification strong{direction:ltr;color:var(--p-green);font-size:7.5pt}.report-header h1{font-size:25pt;color:var(--p-green);line-height:1.2}.report-header p{margin:1.5mm 0 3mm;font-size:10pt;color:#263a32}.gold-line{width:65%;height:.7mm}
.section{margin-top:3mm}.section-title{margin-bottom:2.5mm;padding:2.2mm;border-radius:3mm;background:linear-gradient(110deg,var(--p-green-deep),#148064);font-size:10pt}
.kpi-grid{gap:2mm}.kpi-card{min-height:22mm;padding:2.5mm 1.5mm;border-radius:3.5mm;box-shadow:none}.kpi-icon{font-size:12pt}.kpi-label{font-size:7pt}.kpi-value{font-size:16pt}.readiness-card{margin-top:2.5mm;padding:2.5mm 3mm;grid-template-columns:18mm 1fr 42mm}.readiness-value{font-size:18pt}.readiness-label{font-size:8pt}.readiness-bar{height:2.5mm}
.charts-grid{grid-template-columns:40mm 1fr;gap:3mm}.donut-card,.roles-table-card,.maintenance-card,.summary-card{border-radius:3.5mm;box-shadow:none}.donut-chart{width:27mm;height:27mm}.donut-center{width:16mm;height:16mm}.donut-center strong{font-size:14pt}.legend{font-size:6pt}.roles-table th{padding:2mm;font-size:7.5pt}.roles-table td{padding:1.7mm;font-size:7pt}
.maintenance-table th{padding:2mm;font-size:7pt}.maintenance-table td{padding:1.6mm;font-size:6.5pt}.maintenance-summary{margin-top:2.5mm;padding:2mm}.maintenance-summary div{padding:2mm}.maintenance-summary span{font-size:6.5pt}.maintenance-summary strong{font-size:11pt}
.summary-grid{gap:2.5mm}.summary-card{min-height:30mm}.summary-title{padding:2.3mm;font-size:8pt}.summary-body{min-height:22mm;max-height:none;padding:3mm;font-size:7pt;line-height:1.75;overflow:visible}
.report-footer{margin-top:3mm;padding-top:2.5mm}.generated,.footer-right{font-size:6pt}.rights{font-size:5.5pt}.footer-badge{font-size:6.5pt}
.sidebar-decoration-top,.sidebar-decoration-bottom{opacity:.7}
@media print{.page{break-after:auto}.section,.sidebar-card,.kpi-card,.summary-card,.maintenance-summary{break-inside:avoid}thead{display:table-header-group}tr{break-inside:avoid}.report-footer{break-inside:avoid}}
</style>
