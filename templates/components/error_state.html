<main class="platform-error" dir="rtl">
  <section>
    <span class="platform-error-code">{{ error_code }}</span>
    <div class="platform-error-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 3 7v5c0 5 3.6 8.2 9 9.8 5.4-1.6 9-4.8 9-9.8V7l-9-4Z"/><path d="M12 8v5M12 17h.01"/></svg></div>
    <span class="platform-error-eyebrow">منصة أبواب · مركز النظام</span>
    <h1>{{ error_title }}</h1><p>{{ error_message }}</p>
    <div><a href="{% url 'dashboard:index' %}">العودة إلى لوحة التحكم</a><button type="button" onclick="history.back()">الصفحة السابقة</button></div>
  </section>
</main>
<style>
.platform-error{display:grid;place-items:center;min-height:62vh;padding:24px;background:radial-gradient(circle at center,rgba(213,179,77,.13),transparent 38%),#f7faf8;font-family:"Tajawal","Noto Sans Arabic",sans-serif}.platform-error section{position:relative;width:min(620px,100%);padding:45px 35px;border:1px solid #dce7e2;border-top:4px solid #d5b34d;border-radius:26px;background:#fff;box-shadow:0 22px 55px rgba(6,78,59,.1);text-align:center}.platform-error-code{position:absolute;top:18px;left:22px;color:#dfe8e4;font-size:38px;font-weight:950}.platform-error-mark{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 17px;border-radius:23px;color:#fff;background:linear-gradient(145deg,#0d775a,#054334);box-shadow:0 13px 28px rgba(6,78,59,.2)}.platform-error-mark svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.platform-error-eyebrow{color:#a17e21;font-size:11px;font-weight:900}.platform-error h1{margin:8px 0;color:#17352a;font-size:28px;font-weight:950}.platform-error p{margin:0 auto 25px;color:#718079;font-size:13px;font-weight:650;line-height:1.9}.platform-error section>div:last-child{display:flex;justify-content:center;gap:9px}.platform-error a,.platform-error button{padding:11px 16px;border:1px solid #d7e4de;border-radius:11px;font:800 11px inherit;cursor:pointer}.platform-error a{color:#fff;background:#086149;text-decoration:none}.platform-error button{color:#42564d;background:#f4f8f6}body.dark .platform-error{background:#0c1512}body.dark .platform-error section{border-color:#2b4138;background:#121e1a}body.dark .platform-error h1{color:#edf5f1}@media(max-width:520px){.platform-error section{padding:38px 19px}.platform-error section>div:last-child{flex-direction:column}}
</style>
