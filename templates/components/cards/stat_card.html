<div class="stat-card">

    <div class="stat-icon">
        {{ icon }}
    </div>

    <div class="stat-content">

        <div class="stat-title">
            {{ title }}
        </div>

        <div class="stat-value">
            {{ value }}
        </div>

        {% if subtitle %}
            <div class="stat-subtitle">
                {{ subtitle }}
            </div>
        {% endif %}

    </div>

</div>
