<script>
(function () {
    "use strict";

    let brandClockInterval = null;

    function updateBrandDateTime() {
        const dateTarget = document.getElementById(
            "brand-live-date"
        );

        const timeTarget = document.getElementById(
            "brand-live-time"
        );

        if (!dateTarget || !timeTarget) {
            return;
        }

        const now = new Date();

        dateTarget.textContent = new Intl.DateTimeFormat(
            "ar-SA-u-ca-gregory",
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric",
            }
        ).format(now);

        timeTarget.textContent = new Intl.DateTimeFormat(
            "ar-SA",
            {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit",
                hour12: true,
            }
        ).format(now);
    }

    function startBrandClock() {
        updateBrandDateTime();

        if (brandClockInterval) {
            window.clearInterval(
                brandClockInterval
            );
        }

        brandClockInterval = window.setInterval(
            updateBrandDateTime,
            1000
        );
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            startBrandClock,
            {
                once: true,
            }
        );
    } else {
        startBrandClock();
    }
})();
</script>
