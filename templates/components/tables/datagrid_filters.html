<form method="get" class="datagrid-filters">

    <div class="datagrid-search">

        <input
            type="text"
            name="q"
            value="{{ q }}"
            placeholder="{{ placeholder|default:'بحث...' }}"
        >

    </div>

    <div class="datagrid-filter-fields">
        {{ filters }}
    </div>

    <div class="datagrid-filter-actions">

        <button type="submit" class="btn-filter">
            تطبيق
        </button>

        <a href="{{ reset_url }}" class="btn-reset">
            إعادة ضبط
        </a>

    </div>

</form>
