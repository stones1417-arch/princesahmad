{% extends "base.html" %}

{% block title %}
تم تغيير كلمة المرور | منصة أبواب
{% endblock %}

{% block content %}

<div
    dir="rtl"
    style="
        min-height:70vh;
        display:grid;
        place-items:center;
        padding:30px;
        background:#f7f8f6;
    "
>
    <div
        style="
            width:min(520px, 100%);
            padding:35px;
            border:1px solid #dce6e1;
            border-radius:24px;
            background:#fff;
            text-align:center;
            box-shadow:0 20px 50px rgba(24,43,35,.10);
        "
    >
        <div
            style="
                width:75px;
                height:75px;
                margin:0 auto 18px;
                display:grid;
                place-items:center;
                border-radius:50%;
                background:#edf8f3;
                color:#08714f;
                font-size:34px;
            "
        >
            ✓
        </div>

        <h1
            style="
                margin:0;
                color:#075c45;
                font-size:26px;
                font-weight:950;
            "
        >
            تم تغيير كلمة المرور
        </h1>

        <p
            style="
                margin:12px 0 25px;
                color:#6b7280;
                line-height:1.8;
            "
        >
            تم تحديث كلمة مرور حسابك بنجاح.
        </p>

        <a
            href="{% url 'accounts:profile' %}"
            style="
                min-height:48px;
                padding:10px 20px;
                display:inline-flex;
                align-items:center;
                justify-content:center;
                border-radius:13px;
                background:#075c45;
                color:#fff;
                font-weight:900;
                text-decoration:none;
            "
        >
            العودة إلى الملف الشخصي
        </a>
    </div>
</div>

{% endblock %}
